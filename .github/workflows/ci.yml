name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fieldweaver-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked metadata
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-node-${{ matrix.node }}
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: FW-016 cached 64k interaction profile
        if: matrix.node == 22
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark:render 2>&1 | tee render-profile.txt
      - name: FW-014 30k-agent release profile
        if: matrix.node == 22
        shell: bash
        run: |
          set -o pipefail
          npm run benchmark:release 2>&1 | tee release-profile.txt
      - name: Upload release performance evidence
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: fw-release-performance-node-22
          path: |
            render-profile.txt
            release-profile.txt
          if-no-files-found: ignore
          retention-days: 7

  browser-smoke:
    name: ${{ matrix.browser }} WebGL2 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked metadata
        run: npm ci
      - name: Report browser tooling
        shell: bash
        run: |
          set -x
          command -v google-chrome || true
          command -v chromedriver || true
          command -v firefox || true
          command -v geckodriver || true
          command -v Xvfb || true
      - name: Start Firefox virtual display
        if: matrix.browser == 'firefox'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > xvfb.log 2>&1 &
          echo $! > xvfb.pid
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
          echo 'MOZ_WEBRENDER=1' >> "$GITHUB_ENV"
          sleep 1
      - name: Start local FIELDWEAVER server
        shell: bash
        run: |
          node scripts/serve.mjs > browser-server.log 2>&1 &
          echo $! > browser-server.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat browser-server.log
          exit 1
      - name: Exercise live WebGL2 preview
        run: node scripts/browser-smoke.mjs ${{ matrix.browser }}
      - name: Exercise deterministic timeline replay
        run: node scripts/timeline-browser-smoke.mjs ${{ matrix.browser }}
      - name: Exercise deterministic mutation variants
        run: node scripts/mutation-browser-smoke.mjs ${{ matrix.browser }}
      - name: Exercise canonical software export
        run: node scripts/export-browser-smoke.mjs ${{ matrix.browser }}
      - name: Exercise Infinite Plate deterministic regional evaluation
        run: node scripts/infinite-browser-smoke.mjs ${{ matrix.browser }}
      - name: Exercise FW-014 presets, telemetry, and keyboard accessibility
        run: node scripts/release-browser-smoke.mjs ${{ matrix.browser }}
      - name: Exercise FW-015 WebGPU equivalence research gate
        run: node scripts/gpu-research-browser-smoke.mjs ${{ matrix.browser }}
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fw-browser-${{ matrix.browser }}-smoke
          path: |
            browser-smoke-${{ matrix.browser }}.png
            browser-smoke-${{ matrix.browser }}.log
            timeline-smoke-${{ matrix.browser }}.log
            mutation-smoke-${{ matrix.browser }}.log
            export-smoke-${{ matrix.browser }}.log
            infinite-smoke-${{ matrix.browser }}.log
            release-smoke-${{ matrix.browser }}.log
            gpu-research-smoke-${{ matrix.browser }}.log
            browser-server.log
            xvfb.log
          if-no-files-found: ignore
          retention-days: 7
